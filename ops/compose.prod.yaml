# Production instance. On the server it lives at /home/debian/mirotalksfu/compose.yaml and is updated with
# ops/deploy.sh, which replaces the image line below with the digest it deploys.
#
# Compared with the file that was in use until 2026-10:
#   - the image comes from the repository (ghcr.io), built by CI from the main branch;
#   - config.js is no longer mounted: the image carries it (the bitrate settings it used to override are in
#     app/src/config.template.js now);
#   - production gets a high CPU weight, so the development instance and the recorder never compete with it.
# Everything else (ports, memory, environment files) is the same.

services:
  mirotalksfu:
    image: ghcr.io/theplayzzz/mirotalksfu:main
    container_name: mirotalksfu
    hostname: mirotalksfu
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "127.0.0.1:3012:3010/tcp"
      - "40000-40100:40000-40100/tcp"
      - "40000-40100:40000-40100/udp"
    env_file:
      - ./.env
      - /home/debian/.config/mirotalksfu-prod/room-access.env
      - /home/debian/.config/mirotalksfu-prod/livepix.env
    volumes:
      - ./.env:/src/.env:ro
    cpu_shares: 2048
    mem_limit: 8g
    mem_reservation: 1g
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://127.0.0.1:3010').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 45s
