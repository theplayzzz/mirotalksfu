name: CI

# Tests on every push and pull request. On main and develop the Docker image is also built and published
# to GitHub Container Registry as ghcr.io/theplayzzz/mirotalksfu:sha-<commit> (and :main / :develop).
# Servers pull the image by digest, so nothing is compiled on the production machine.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm

      # The tests do not need the browser bundle, so skip the build scripts.
      - run: npm ci --ignore-scripts

      # The real mediasoup worker (a prebuilt binary of a few MB) lets tests/replay/test-sfu-mediasoup.js run. Without
      # it those tests are skipped, so a failure here does not fail the build.
      - name: mediasoup worker (prebuilt)
        run: npm rebuild mediasoup
        continue-on-error: true
        timeout-minutes: 6

      - run: cp app/src/config.template.js app/src/config.js
      - run: npm test

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "ref=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ghcr.io/theplayzzz/mirotalksfu:sha-${{ steps.tags.outputs.sha }}
            ghcr.io/theplayzzz/mirotalksfu:${{ steps.tags.outputs.ref }}
          labels: |
            org.opencontainers.image.source=https://github.com/theplayzzz/mirotalksfu
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image"
            echo
            echo '```'
            echo "ghcr.io/theplayzzz/mirotalksfu@${{ steps.build.outputs.digest }}"
            echo "ghcr.io/theplayzzz/mirotalksfu:sha-${{ steps.tags.outputs.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
